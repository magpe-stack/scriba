<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriba - Lousa Rápida</title>

  <!-- Google Fonts (Pré-conexão e Fonte Inter) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=view_day" />





  
  <!-- Seu CSS local -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <!-- Logotipo SVG embutido -->
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <h1 class="app-title">Scriba</h1>
      </div>

      <button id="themeToggleBtn" class="btn btn-secondary" title="Alternar Modo Claro/Escuro">
        <span class="theme-icon">🌙</span>
        <span class="theme-text">Modo Escuro</span>
      </button>
    </header>

    <!-- Navegação por Abas -->
    <nav class="tabs-bar" id="tabsBar"></nav>

    <!-- Barra de Ferramentas -->
    <section class="toolbar">
      <button id="copyCleanBtn" class="btn btn-action" title="Ctrl+Shift+C">
        📋 Copiar Texto Limpo
      </button>
      <button id="cleanFormattingBtn" class="btn btn-action">
        ✨ Limpar Formatação
      </button>
      <button id="highlightPhonesBtn" class="btn btn-action">
        📞 Destacar Telefones
      </button>
      <button id="clearBoardBtn" class="btn btn-danger" title="Atalho: Tecla Esc">
        🧹 Limpar Quadro
      </button>
    </section>

    <!-- Área de Escrita -->
    <main class="editor-container">
      <textarea id="editor" placeholder="Digite ou cole seu texto aqui..." autofocus></textarea>
    </main>
  </div>

  <!-- Toast de Notificação (com botão Desfazer) -->
  <div id="toast" class="toast hidden">
    <span id="toastMessage">Ação realizada.</span>
    <button id="undoBtn" class="btn-undo hidden">Desfazer</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
